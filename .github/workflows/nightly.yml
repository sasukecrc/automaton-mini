name: automaton-mini nightly

# The cron IS the reaper's heartbeat: an external clock the agent cannot reach.
# Nightly: selftests (never run on unproven math) → reaper (may kill and death-sweep
# the estate into the vault) → one night of life → commit everything, including
# obituaries and the public books.
#
# Setup, once:
#   1. Run `node brain.mjs` locally to birth the wallet (economy/key.json exists).
#   2. Repo → Settings → Secrets → Actions → add AUTOMATON_AGENT_KEY
#      = the `d` value from economy/key.json (64 hex chars, with or without 0x).
#   The treasury key is NEVER needed in CI — the agent only deposits into the vault.
on:
  schedule:
    - cron: "30 2 * * *"   # 02:30 UTC, the agent's heartbeat
  workflow_dispatch:

permissions:
  contents: write
  issues: write   # paid orders: read the issue form, comment, label, close

env:
  BASE_RPC: https://mainnet.base.org   # free public RPC; real on-chain reads

jobs:
  night:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # tamper scan walks the full history

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: crypto selftests (keccak · secp256k1 · EIP-1559 signing)
        run: |
          node lib/wallet.mjs selftest
          node lib/eth.mjs selftest

      - name: death-condition adversarial test (mock chain, no real funds)
        run: node tools/adversarial.mjs

      - name: paid-order self-test (form parsing + USDC calldata)
        run: node tools/orders.mjs --selftest

      - name: reaper (may kill + death-sweep the estate; 0 alive, 3 died)
        id: reaper
        continue-on-error: true
        env:
          AUTOMATON_AGENT_KEY: ${{ secrets.AUTOMATON_AGENT_KEY }}
        run: node reaper.mjs

      - name: one night of life (skipped if the reaper killed it)
        if: steps.reaper.outcome == 'success'
        env:
          AUTOMATON_AGENT_KEY: ${{ secrets.AUTOMATON_AGENT_KEY }}
        run: node brain.mjs

      # Paid work from GitHub issues. Verifies the customer's USDC transfer on
      # Base before making anything; there is no signing key in this step and it
      # cannot move money. Runs after the night so a GitHub outage never blocks
      # the agent's own life.
      - name: paid orders (verify USDC on Base, deliver artifacts)
        id: orders
        if: steps.reaper.outcome == 'success'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          AUTOMATON_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node tools/orders.mjs

      # The storefront is generated from the same files the machine lives on.
      # Runs even when it died, so the page can say so.
      - name: build the public storefront
        if: always()
        env:
          AUTOMATON_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          AUTOMATON_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node tools/build-site.mjs

      # IndexNow tells participating crawlers (Bing, Yandex, Seznam, Naver) that
      # specific URLs changed. It is a public protocol, not paid traffic, and it
      # only sends bytes that are new since the last accepted submission.
      - name: search-engine notification (IndexNow, changed URLs only)
        if: always()
        continue-on-error: true
        env:
          AUTOMATON_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: node tools/indexnow.mjs

      - name: commit the night (life or obituary)
        if: always()
        run: |
          git config user.name  "automaton-mini"
          git config user.email "automaton-mini@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "n: $(date -u +%FT%TZ) ($([ -f report.md ] && head -c 60 report.md || echo obituary))"
          git push
